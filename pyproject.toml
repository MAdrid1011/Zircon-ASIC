[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zircon-asic"
version = "0.3.0"
description = "Cycle-aligned Python/Chisel arithmetic, nonlinear and scratchpad building blocks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
fast = ["numba>=0.59"]
test = ["pytest>=7.4", "hypothesis>=6", "cocotb>=2.0", "build>=1"]
verify = ["gmpy2==2.3.1"]

[project.scripts]
zircon = "zircon_asic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zircon_asic = ["data/*.json", "data/*.bin", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["exhaustive: exhaustive release validation", "rtl: requires generated RTL and Verilator", "oracle: requires an external oracle"]
